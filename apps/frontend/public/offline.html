<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0f">
  <title>VouchNodes is offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0a0f; color: #e2e8f0; font: 16px system-ui, sans-serif; }
    main { max-width: 28rem; padding: 2rem; text-align: center; }
    h1 { color: #fff; font-size: 1.5rem; }
    p { color: #94a3b8; line-height: 1.6; }
    button { margin-top: 1rem; border: 0; border-radius: .75rem; background: #6366f1; color: #fff; padding: .75rem 1rem; font: inherit; font-weight: 600; }
  </style>
  <main>
    <h1>You’re offline</h1>
    <p>Reconnect to continue using VouchNodes. Previously loaded static assets may still be available.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</html>
